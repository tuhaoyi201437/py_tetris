<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 258" width="680" height="258" role="img">
  <title>俄罗斯方块七种形状与颜色对应</title>
  <desc>每种形状固定一种颜色：I青、O黄、T紫、S绿、Z红、J蓝、L橙。形状与颜色一一绑定，因此不存在蓝色加T形状的方块。</desc>
  <text x="340" y="34" text-anchor="middle" font-family="sans-serif" font-size="15" font-weight="500" fill="#1a1a1a">7 种方块：形状 ↔ 颜色 一一对应</text>

  <rect x="40" y="82" width="84" height="132" rx="8" fill="#f5f5f7" stroke="#e2e2e6"/>
  <rect x="124" y="82" width="84" height="132" rx="8" fill="#f5f5f7" stroke="#e2e2e6"/>
  <rect x="208" y="82" width="84" height="132" rx="8" fill="#f5f5f7" stroke="#e2e2e6"/>
  <rect x="292" y="82" width="84" height="132" rx="8" fill="#f5f5f7" stroke="#e2e2e6"/>
  <rect x="376" y="82" width="84" height="132" rx="8" fill="#f5f5f7" stroke="#e2e2e6"/>
  <rect x="460" y="82" width="84" height="132" rx="8" fill="#f5f5f7" stroke="#e2e2e6"/>
  <rect x="544" y="82" width="84" height="132" rx="8" fill="#f5f5f7" stroke="#e2e2e6"/>

  <rect x="50" y="100" width="16" height="16" rx="3" fill="#00F0F0"/>
  <rect x="66" y="100" width="16" height="16" rx="3" fill="#00F0F0"/>
  <rect x="82" y="100" width="16" height="16" rx="3" fill="#00F0F0"/>
  <rect x="98" y="100" width="16" height="16" rx="3" fill="#00F0F0"/>
  <text x="82" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#1a1a1a">I</text>
  <text x="82" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">青色</text>

  <rect x="150" y="100" width="16" height="16" rx="3" fill="#F0F000"/>
  <rect x="166" y="100" width="16" height="16" rx="3" fill="#F0F000"/>
  <rect x="150" y="116" width="16" height="16" rx="3" fill="#F0F000"/>
  <rect x="166" y="116" width="16" height="16" rx="3" fill="#F0F000"/>
  <text x="166" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#1a1a1a">O</text>
  <text x="166" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">黄色</text>

  <rect x="234" y="100" width="16" height="16" rx="3" fill="#AA00F0"/>
  <rect x="218" y="116" width="16" height="16" rx="3" fill="#AA00F0"/>
  <rect x="234" y="116" width="16" height="16" rx="3" fill="#AA00F0"/>
  <rect x="250" y="116" width="16" height="16" rx="3" fill="#AA00F0"/>
  <text x="250" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#1a1a1a">T</text>
  <text x="250" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">紫色</text>

  <rect x="318" y="100" width="16" height="16" rx="3" fill="#00F000"/>
  <rect x="334" y="100" width="16" height="16" rx="3" fill="#00F000"/>
  <rect x="302" y="116" width="16" height="16" rx="3" fill="#00F000"/>
  <rect x="318" y="116" width="16" height="16" rx="3" fill="#00F000"/>
  <text x="334" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#1a1a1a">S</text>
  <text x="334" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">绿色</text>

  <rect x="386" y="100" width="16" height="16" rx="3" fill="#F00000"/>
  <rect x="402" y="100" width="16" height="16" rx="3" fill="#F00000"/>
  <rect x="402" y="116" width="16" height="16" rx="3" fill="#F00000"/>
  <rect x="418" y="116" width="16" height="16" rx="3" fill="#F00000"/>
  <text x="402" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#1a1a1a">Z</text>
  <text x="402" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">红色</text>

  <rect x="470" y="100" width="16" height="16" rx="3" fill="#0064F0"/>
  <rect x="470" y="116" width="16" height="16" rx="3" fill="#0064F0"/>
  <rect x="486" y="116" width="16" height="16" rx="3" fill="#0064F0"/>
  <rect x="502" y="116" width="16" height="16" rx="3" fill="#0064F0"/>
  <text x="502" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#1a1a1a">J</text>
  <text x="502" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">蓝色</text>

  <rect x="586" y="100" width="16" height="16" rx="3" fill="#F0A000"/>
  <rect x="554" y="116" width="16" height="16" rx="3" fill="#F0A000"/>
  <rect x="570" y="116" width="16" height="16" rx="3" fill="#F0A000"/>
  <rect x="586" y="116" width="16" height="16" rx="3" fill="#F0A000"/>
  <text x="586" y="180" text-anchor="middle" font-family="sans-serif" font-size="14" font-weight="500" fill="#1a1a1a">L</text>
  <text x="586" y="200" text-anchor="middle" font-family="sans-serif" font-size="12" fill="#555">橙色</text>

  <text x="340" y="240" text-anchor="middle" font-family="sans-serif" font-size="13" fill="#444">T 是紫色、J 是蓝色 —— 形状与颜色绑定，所以没有「蓝色 + T 形状」的方块</text>
</svg>
